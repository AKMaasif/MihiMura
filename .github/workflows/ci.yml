name: MihiMura CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mihimura-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: mihimura-backend/.python-version
          cache: pip
          cache-dependency-path: mihimura-backend/requirements.txt
      - name: Install Sinhala/Tamil PDF fonts (same as the Docker image)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-core
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q app
      - name: Run offline regression tests
        # smoke_test.py needs a real Supabase project, so it is run manually.
        run: |
          failed=0
          for test in tests/*_test.py; do
            if [ "$test" = "tests/smoke_test.py" ]; then continue; fi
            echo "::group::$test"
            if python "$test" > test-output.log 2>&1; then
              cat test-output.log
            else
              cat test-output.log
              failed=1
              summary=$(tail -n 6 test-output.log | tr '\n' ' ' | cut -c1-900)
              echo "::error title=$test failed::$summary"
            fi
            echo "::endgroup::"
          done
          exit $failed

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mihimura-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mihimura-web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check and build
        run: npm run build
